<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bio-Signal Visualizer | Empatica EmbracePlus Data Analysis Tool</title>
    <meta name="description" content="An advanced, open-source ASP.NET Core and Blazor WebAssembly tool for visualizing, analyzing, and annotating digital biomarker data from Empatica EmbracePlus wearables." />
    <meta name="keywords" content="Empatica EmbracePlus, Bio-Signal, Digital Biomarkers, Data Visualization, ASP.NET Core, Blazor, Health Tech, Wearable Data, EDA, Actigraphy" />
    <meta name="author" content="Conor Anderson" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <script src="js/download.js"></script>
</head>

<body>
    <div id="app">Loading...</div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const observer = new MutationObserver(() => {
                const tooltips = document.querySelectorAll('.apexcharts-tooltip.apexcharts-active');
                if (tooltips.length <= 1) return;

                let targetTime = null;
                const hoveredChart = document.querySelector('.apexcharts-canvas:hover');
                if (hoveredChart) {
                    const tooltip = hoveredChart.querySelector('.apexcharts-tooltip.apexcharts-active .apexcharts-tooltip-title');
                    if (tooltip) {
                        targetTime = tooltip.innerText;
                    }
                }

                if (targetTime) {
                    tooltips.forEach(tt => {
                        const title = tt.querySelector('.apexcharts-tooltip-title');
                        if (title && title.innerText !== targetTime) {
                            tt.style.opacity = '0';
                        } else {
                            tt.style.opacity = '1';
                        }
                    });
                }
            });
            observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });

            document.addEventListener("mousemove", (e) => {
                if (!e.target.closest('.metric-chart-wrapper')) {
                    document.querySelectorAll('.apexcharts-tooltip.apexcharts-active').forEach(tt => {
                        tt.classList.remove('apexcharts-active');
                        tt.style.opacity = '0';
                    });
                    document.querySelectorAll('.apexcharts-xcrosshairs.apexcharts-active').forEach(tt => {
                        tt.classList.remove('apexcharts-active');
                        tt.style.opacity = '0';
                    });
                }
            });
        });
    </script>
</body>

</html>
